[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-guided-graph-mvp"
version = "0.3.0"
description = "Task-guided GRPO graph learning with vector-GGM and matrix-normal MNGM backends"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7"]
rl = ["torch>=2.0"]
medical = ["pandas>=2.0"]
llm = ["torch>=2.0", "transformers>=5.0.0", "peft>=0.13", "accelerate>=1.0"]
patient = ["torch>=2.0", "pandas>=2.0", "transformers>=4.51", "huggingface_hub>=0.25", "accelerate>=1.0"]
all = ["pytest>=7", "torch>=2.0", "pandas>=2.0", "transformers>=5.0.0", "peft>=0.13", "huggingface_hub>=0.25", "accelerate>=1.0"]

[project.scripts]
graph-mvp = "graph_mvp.cli:main"
prepare-qsar = "graph_mvp.qsar_cli:main"
prepare-mimic-ed = "graph_mvp.mimic_cli:main"
prepare-diabetes130 = "graph_mvp.diabetes130_cli:main"

[tool.setuptools.packages.find]
include = ["graph_mvp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
